[package]
name = "gogamen-jev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Decoupled, opt-in Jev adapter for the System One port: versioned HTTP contract (hypothesis, unverified against the real service), strict timeouts, circuit breaker, Replay fallback and secret redaction."

[features]
default = []
# Pulls the blocking HTTP client (plain http://). Without it the crate has no network code at all.
http = ["dep:ureq"]
# Adds TLS (rustls) so https:// endpoints can be used. Not exercised by the offline tests.
https = ["http", "ureq/rustls"]

[dependencies]
gogamen-core = { path = "../gogamen-core" }
serde_json = "1"
ureq = { version = "3", default-features = false, optional = true }

[[test]]
name = "contract"
path = "tests/contract.rs"
required-features = ["http"]

[[example]]
name = "jev_smoke"
path = "examples/jev_smoke.rs"
required-features = ["http"]
