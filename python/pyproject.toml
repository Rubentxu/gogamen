[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gogamen"
version = "0.1.0"
description = "SDK Python stdlib-only para Gogamen sobre protocolo residente JSON-Lines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["gogamen*"]
